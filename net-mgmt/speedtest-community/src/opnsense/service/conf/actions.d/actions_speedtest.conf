[version]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py version
parameters:
type:script_output
message: Displays the local measurement engine version

[serverlist]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py list ookla
parameters:
type:script_output
message: List enabled legacy measurement targets (json)

[serverlist-provider]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py list
parameters:%s
type:script_output
message: List enabled targets for a measurement network (json)

[providers]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py providers
parameters:
type:script_output
message: List measurement network status and capabilities

[discover]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py discover
parameters:%s
type:script_output
message: Refresh public measurement target lists

[run]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py
parameters:%s
type:script_output
message: Run the legacy measurement with an optional target id (json)
description: Run measurement [targetid]

[run-provider]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py run
parameters:%s %s
type:script_output
message: Run a measurement with network and target selection (json)
description: Run measurement [network] [target]

[showstat]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py stat
parameters: 
type:script_output
message: Shows speedtest statistics

[showlog]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py log
parameters: 
type:script_output
message: Shows speedtest log (last 50 entries)

[showrecent]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py recent
parameters: 
type:script_output
message: Shows speedtest most recent log entry

[deletelog]
command:/bin/rm -f /usr/local/opnsense/scripts/OPNsense/speedtest/speedtest.csv
parameters: 
type:script_output
message: Delete the csv log file

[install-http]
command:/bin/sh /usr/local/opnsense/scripts/OPNsense/speedtest/install_speedtest.sh native
parameters: 
type:script_output
message: Install the native measurement CLI (legacy compatibility action)

[install-socket]
command:/bin/sh /usr/local/opnsense/scripts/OPNsense/speedtest/install_speedtest.sh native
parameters: 
type:script_output
message: Install the native measurement CLI

[install-rust]
command:/bin/sh /usr/local/opnsense/scripts/OPNsense/speedtest/install_speedtest.sh rust
parameters:
type:script_output
message: Build and install the native Rust HTTP transfer engine using a temporary FreeBSD toolchain

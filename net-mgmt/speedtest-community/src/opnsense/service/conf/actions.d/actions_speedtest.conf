[version]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py version
parameters:
type:script_output
message: Displays LibreSpeed version

[validate-settings]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py check-settings both
parameters: %s
type:script_output
message: Validate LibreSpeed settings before saving

[serverlist]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py list
parameters:
type:script_output
message: List configured LibreSpeed servers (json)

[public-list]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py public-list
parameters:
type:script_output
message: Retrieve the official LibreSpeed server catalog

[run]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py
parameters: %s
type:script_output
message: Run LibreSpeed with or without a server ID (json)
description: Run LibreSpeed [serverid]

[run-mode]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py
parameters: %s %s
type:script_output
message: Run LibreSpeed in the selected test mode

[run-options]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py
parameters: %s %s %s
type:script_output
message: Run LibreSpeed with validated measurement options

[start]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py
parameters: %s %s %s --run-id %s --origin manual
type:script_output
message: Start a LibreSpeed measurement with progress

[status]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py status
parameters:
type:script_output
message: Read LibreSpeed measurement progress

[detect]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py detect
parameters: %s %s --run-id %s --origin manual
type:script_output
message: Detect the lowest-latency LibreSpeed server without measuring bandwidth

[detection-status]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py detection-status
parameters:
type:script_output
message: Read LibreSpeed server detection progress

[history]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py history
parameters: %s
type:script_output
message: Query detailed LibreSpeed history and trends

[scheduled]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py scheduled
parameters:
type:script_output
message: Run the saved LibreSpeed schedule
description: Run scheduled LibreSpeed measurements

[validate-schedule]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py check-schedule both
parameters: %s
type:script_output
message: Validate a LibreSpeed schedule before saving

[showstat]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py stat
parameters: 
type:script_output
message: Shows speedtest statistics

[showlog]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py log
parameters: 
type:script_output
message: Shows speedtest log (last 50 entries)

[showrecent]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py recent
parameters: 
type:script_output
message: Shows speedtest most recent log entry

[deletelog]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/speedtest/opn_speedtest.py clear
parameters: 
type:script_output
message: Delete the csv log file
